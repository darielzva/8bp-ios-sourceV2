name: Build 8Ball Tweak

on:
  push:
    branches: [ main, master ]
    tags:    [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile 8Ball.dylib
    runs-on: macos-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Theos + iOS SDK ───────────────────────────────────────────────────
      - name: Setup Theos
        uses: theos/theos-action@v2
        with:
          sdk-version: '16.5'
          cache: true
          cache-id: theos-16.5

      # ── 3. Build ─────────────────────────────────────────────────────────────
      - name: Compile
        run: |
          make package \
            ARCHS=arm64 \
            DEBUG=0 \
            FINALPACKAGE=1 \
            FOR_RELEASE=1 \
            THEOS_PACKAGE_SCHEME=rootless

      # ── 4. Extraer dylib del .deb ─────────────────────────────────────────────
      - name: Extract dylib from .deb
        id: extract
        run: |
          DEB=$(find packages -name "*.deb" | head -1)
          echo "Found deb: $DEB"

          mkdir -p /tmp/deb_extracted
          dpkg-deb -x "$DEB" /tmp/deb_extracted

          DYLIB=$(find /tmp/deb_extracted -name "*.dylib" | head -1)

          if [ -z "$DYLIB" ]; then
            echo "dpkg-deb fallback — trying .theos/obj/"
            DYLIB=$(find .theos/obj -name "*.dylib" 2>/dev/null | head -1)
          fi

          echo "dylib=$DYLIB" >> "$GITHUB_OUTPUT"
          ls -lh "$DYLIB"
          file "$DYLIB"

          cp "$DYLIB" 8Ball.dylib

      # ── 5. Upload dylib ───────────────────────────────────────────────────────
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: 8Ball-dylib-${{ github.sha }}
          path: 8Ball.dylib
          if-no-files-found: error
          retention-days: 90

      # ── 6. Upload .deb también ────────────────────────────────────────────────
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: 8Ball-deb-${{ github.sha }}
          path: packages/*.deb
          if-no-files-found: warn
          retention-days: 90

      # ── 7. Release en tag v* ──────────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            8Ball.dylib
            packages/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
