name: Build 8Ball Tweak

on:
  push:
    branches: [ main, master ]
    tags:    [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  THEOS: ${{ github.workspace }}/theos

jobs:
  build:
    name: Compile 8Ball.dylib
    runs-on: macos-latest

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Dependencias brew ─────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          brew install ldid make dpkg

      # ── 3. Cache Theos ───────────────────────────────────────────────────────
      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-v1

      # ── 4. Instalar Theos ─────────────────────────────────────────────────────
      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          git clone --recursive https://github.com/theos/theos.git $THEOS

      # ── 5. Cache iOS SDK ──────────────────────────────────────────────────────
      - name: Cache iOS SDK
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos/sdks
          key: theos-sdks-16.5-v1

      # ── 6. Descargar iOS SDK ──────────────────────────────────────────────────
      - name: Download iOS 16.5 SDK
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          curl -LO https://github.com/theos/sdks/releases/download/v2024.1/iPhoneOS16.5.sdk.tar.zst
          tar --use-compress-program zstd -xf iPhoneOS16.5.sdk.tar.zst -C "$THEOS/sdks/"

      # ── 7. Build ──────────────────────────────────────────────────────────────
      - name: Compile
        run: |
          gmake package \
            ARCHS=arm64 \
            DEBUG=0 \
            FINALPACKAGE=1 \
            FOR_RELEASE=1 \
            THEOS_PACKAGE_SCHEME=rootless

      # ── 8. Extraer dylib del .deb ─────────────────────────────────────────────
      - name: Extract dylib
        id: extract
        run: |
          DEB=$(find packages -name "*.deb" | head -1)
          echo "deb: $DEB"

          mkdir -p /tmp/deb_extracted
          dpkg-deb -x "$DEB" /tmp/deb_extracted

          DYLIB=$(find /tmp/deb_extracted -name "*.dylib" | head -1)

          if [ -z "$DYLIB" ]; then
            DYLIB=$(find .theos/obj -name "*.dylib" 2>/dev/null | head -1)
          fi

          ls -lh "$DYLIB"
          file "$DYLIB"
          cp "$DYLIB" 8Ball.dylib

      # ── 9. Upload dylib ───────────────────────────────────────────────────────
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: 8Ball-dylib-${{ github.sha }}
          path: 8Ball.dylib
          if-no-files-found: error
          retention-days: 90

      # ── 10. Upload .deb ───────────────────────────────────────────────────────
      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: 8Ball-deb-${{ github.sha }}
          path: packages/*.deb
          if-no-files-found: warn
          retention-days: 90

      # ── 11. Release en tag v* ─────────────────────────────────────────────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            8Ball.dylib
            packages/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
